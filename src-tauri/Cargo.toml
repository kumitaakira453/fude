[package]
name = "app"
# リリース版の version は tauri.conf.json が正。ここは固定し、リリースごとに
# 変更しない（Cargo.lock を安定させ、CI の Rust キャッシュを毎回ヒットさせるため）。
version = "0.2.5"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# レビュー機能。台帳と版の内容ハッシュ、CLI の引数解析、
# NFD で作られたファイル名を突き合わせるための正規化に使う。
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Dock メニュー。Tauri v2 に API が無いので Objective-C ランタイムを直接叩く。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# CI のビルド時間短縮を優先したリリースプロファイル。
# Rust 側は薄い（ファイル I/O とプラグイン仲介のみ）ため、実行時最適化より
# 「速くコンパイルできる」ことを優先する（opt-level を下げ・並列度を上げ・LTO 無効）。
[profile.release]
opt-level = 1
codegen-units = 256
lto = false
incremental = false
strip = true
