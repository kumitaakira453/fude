<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- バンドラに通して内容から名前を作らせる。public/ に置くと名前が変わらず、
         絵を入れ替えても WebView が古いものを出し続ける -->
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="preload" href="/fonts/lobster-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>fude</title>
    <!-- 画面の JS が動くまでの見た目。前回のテーマの地とアクセントだけを当て、
         起動の幕を出す。色は src/index.css の --mg-bg / --mg-accent と
         同じ値（bootLook.test.ts で一致を見る）。 -->
    <script>
      (function () {
        var looks = {
          aurora: ["#0e1116", "#4fd1c5"],
          midnight: ["#0b1020", "#6ea8fe"],
          nord: ["#2e3440", "#88c0d0"],
          forest: ["#0f1a14", "#6ee7a8"],
          dracula: ["#282a36", "#bd93f9"],
          tokyonight: ["#1a1b26", "#7aa2f7"],
          catppuccin: ["#1e1e2e", "#89b4fa"],
          rosepine: ["#191724", "#9ccfd8"],
          paper: ["#faf7f0", "#b45309"],
          sunset: ["#fff7f2", "#f97316"],
          rose: ["#fdf5f8", "#db2777"],
          solarized: ["#fdf6e3", "#268bd2"],
          daylight: ["#fbfcfd", "#2563eb"],
          latte: ["#eff1f5", "#8839ef"],
          mint: ["#f5faf7", "#0f766e"],
          lavender: ["#f8f6fd", "#6d28d9"],
        };
        var id = "aurora";
        try {
          var saved = JSON.parse(localStorage.getItem("mdglow:theme") || "null");
          if (saved && looks[saved]) id = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = id;
        root.style.setProperty("--boot-bg", looks[id][0]);
        root.style.setProperty("--boot-accent", looks[id][1]);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 画面の CSS が届いたら、テーマの地（--mg-bg）に替わる。 */
        background: var(--mg-bg, var(--boot-bg, #0e1116));
      }
      /* 名前の書体（src/index.css と同じ同梱の Lobster）。幕の字にも使う。 */
      @font-face {
        font-family: "Lobster";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/lobster-latin.woff2") format("woff2");
      }
      /* 起動の幕。画面が前回の続きを描き終えるまで上にかぶせておき、
         描けたら下ろす（src/lib/boot.ts）。途中の空の画面を見せない。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background-color: var(--boot-bg, #0e1116);
      }
      /* 下ろすときは、地を先に薄くして下の画面を見せ、字が画面の中の名前の位置へ
         収まってから全体を消す（src/lib/boot.ts。合わせて 420ms）。 */
      #boot.is-done {
        background-color: transparent;
        opacity: 0;
        pointer-events: none;
        transition:
          background-color 0.3s ease,
          opacity 0.12s ease 0.3s;
      }
      /* 動かす前に書く動きを止め、書き終えた形にする。筆と線は先に消す。 */
      #boot.is-landing .boot-ink {
        animation: none;
        opacity: 1;
      }
      #boot.is-landing .boot-word {
        animation: none;
        clip-path: inset(0);
        transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot.is-landing .boot-brush,
      #boot.is-landing .boot-line {
        animation: none;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      /* 筆が「fude」と書く。字は筆先の後ろから現れ、書き終えると筆が離れて
         下に墨の線を引く。少し置いてから消え、また書く。 */
      /* 動かす要素は描画の層に載り、層は箱の大きさで切られる。Lobster の f は
         払いが箱の左下へはみ出すので、余白を持たせて箱の中に収める（負の
         外側余白で、見た目の位置は変えない）。 */
      .boot-ink {
        --w: 92px;
        --loop: 2.8s;
        position: relative;
        padding: 18px 28px;
        color: var(--boot-accent, #4fd1c5);
        animation: boot-show var(--loop) ease infinite;
      }
      .boot-word {
        display: block;
        font: 400 46px/1.15 "Lobster", sans-serif;
        letter-spacing: -0.035em;
        padding: 14px 22px;
        margin: -14px -22px;
        clip-path: inset(0 calc(100% - 22px) 0 0);
        animation: boot-write var(--loop) linear infinite;
      }
      .boot-line {
        position: absolute;
        left: 30px;
        bottom: 8px;
        width: calc(var(--w) * 0.9);
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          currentColor,
          color-mix(in srgb, currentColor 30%, transparent)
        );
        transform: scaleX(0);
        transform-origin: left center;
        animation: boot-line var(--loop) cubic-bezier(0.2, 0.9, 0.3, 1) infinite;
      }
      /* 筆。印（src/assets/mark.png）から下の払いを外し、筆だけを小さく
         切り出した形を埋め込む。dev では起動時に数百の部品を取りに行くので、
         絵を別に取らせると後ろで待たされて筆が出ない。筆先（左下寄り）が、
         字の書き終わりの位置に来るように置く。 */

        left: 12px;
        top: 20px;
        width: 44px;
        height: 37px;

        animation: boot-brush var(--loop) linear infinite;
      }
      @keyframes boot-show {
        0% {
          opacity: 0;
        }
        5%,
        86% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes boot-write {
        0% {
          clip-path: inset(0 calc(100% - 22px) 0 0);
        }
        56%,
        100% {
          clip-path: inset(0);
        }
      }
      @keyframes boot-brush {
        0% {
          transform: translate(0, 0) rotate(-14deg);
          opacity: 1;
        }
        14% {
          transform: translate(calc(var(--w) * 0.22), -5px) rotate(-6deg);
        }
        28% {
          transform: translate(calc(var(--w) * 0.47), 3px) rotate(-16deg);
        }
        42% {
          transform: translate(calc(var(--w) * 0.72), -4px) rotate(-7deg);
        }
        56% {
          transform: translate(var(--w), 2px) rotate(-13deg);
          opacity: 1;
        }
        68%,
        100% {
          transform: translate(calc(var(--w) + 10px), -14px) rotate(6deg);
          opacity: 0;
        }
      }
      @keyframes boot-line {
        0%,
        58% {
          transform: scaleX(0);
        }
        74%,
        100% {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ink,
        .boot-word,
        .boot-line,
        .boot-brush {
          animation: none;
        }
        .boot-word {
          clip-path: none;
        }
        .boot-line {
          transform: none;
        }
        .boot-brush {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-label="読み込み中">
      <div class="boot-ink">
        <span class="boot-word">fude</span>
        <span class="boot-line"></span>
        <span class="boot-brush"></span>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById("boot");
        // 筆が進む幅は、書く字の幅に合わせる（書体が届いてから測る）。
        var ink = boot.querySelector(".boot-ink");
        var word = boot.querySelector(".boot-word");
        var fit = function () {
          // 字の箱は左右に 22px ずつ余白を持つので、その分を除く。
          ink.style.setProperty("--w", word.getBoundingClientRect().width - 44 + "px");
        };
        fit();
        if (document.fonts) document.fonts.load('46px "Lobster"').then(fit, function () {});
        // 画面が幕を下ろせずに終わっても（描画の失敗など）、いつまでも隠さない。
        setTimeout(function () {
          boot.remove();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
