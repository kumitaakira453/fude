<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- バンドラに通して内容から名前を作らせる。public/ に置くと名前が変わらず、
         絵を入れ替えても WebView が古いものを出し続ける -->
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="preload" href="/fonts/lobster-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>fude</title>
    <!-- 画面の JS が動くまでの見た目。前回のテーマの地とアクセントだけを当て、
         起動の幕を出す。色は src/index.css の --mg-bg / --mg-accent と
         同じ値（bootLook.test.ts で一致を見る）。 -->
    <script>
      (function () {
        var looks = {
          aurora: ["#0e1116", "#4fd1c5"],
          midnight: ["#0b1020", "#6ea8fe"],
          nord: ["#2e3440", "#88c0d0"],
          forest: ["#0f1a14", "#6ee7a8"],
          dracula: ["#282a36", "#bd93f9"],
          tokyonight: ["#1a1b26", "#7aa2f7"],
          catppuccin: ["#1e1e2e", "#89b4fa"],
          rosepine: ["#191724", "#9ccfd8"],
          paper: ["#faf7f0", "#b45309"],
          sunset: ["#fff7f2", "#f97316"],
          rose: ["#fdf5f8", "#db2777"],
          solarized: ["#fdf6e3", "#268bd2"],
          daylight: ["#fbfcfd", "#2563eb"],
          latte: ["#eff1f5", "#8839ef"],
          mint: ["#f5faf7", "#0f766e"],
          lavender: ["#f8f6fd", "#6d28d9"],
          business: ["#ffffff", "#1f4e8c"],
        };
        var id = "aurora";
        try {
          var saved = JSON.parse(localStorage.getItem("mdglow:theme") || "null");
          if (saved && looks[saved]) id = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = id;
        root.style.setProperty("--boot-bg", looks[id][0]);
        root.style.setProperty("--boot-accent", looks[id][1]);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 画面の CSS が届いたら、テーマの地（--mg-bg）に替わる。 */
        background: var(--mg-bg, var(--boot-bg, #0e1116));
      }
      /* 名前の書体（src/index.css と同じ同梱の Lobster）。幕の字にも使う。 */
      @font-face {
        font-family: "Lobster";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/lobster-latin.woff2") format("woff2");
      }
      /* 起動の幕。画面が前回の続きを描き終えるまで上にかぶせておき、
         描けたら下ろす（src/lib/boot.ts）。途中の空の画面を見せない。 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background-color: var(--boot-bg, #0e1116);
      }
      /* 下ろすときは、地を先に薄くして下の画面を見せ、字が画面の中の名前の位置へ
         収まってから全体を消す（src/lib/boot.ts。合わせて 420ms）。 */
      #boot.is-done {
        background-color: transparent;
        opacity: 0;
        pointer-events: none;
        transition:
          background-color 0.3s ease,
          opacity 0.12s ease 0.3s;
      }
      /* 動かす前に線を消し、字は現れ終えた形で止める。 */
      #boot.is-landing .boot-word {
        animation: none;
        clip-path: inset(0);
        transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot.is-landing .boot-track {
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      /* 名前を左から 1 度だけ現し、その下の細い線の上を短い線が往復する
         （読み込んでいる印）。線の角は落とさず、色は 1 色で塗る。 */
      .boot-ink {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        color: var(--boot-accent, #4fd1c5);
      }
      /* 動かす要素は描画の層に載り、層は箱の大きさで切られる。Lobster の f は
         払いが箱の左下へはみ出すので、余白を持たせて箱の中に収める（負の
         外側余白で、見た目の位置は変えない）。 */
      .boot-word {
        display: block;
        font: 400 46px/1.15 "Lobster", sans-serif;
        letter-spacing: -0.035em;
        padding: 14px 22px;
        margin: -14px -22px;
        clip-path: inset(0 100% 0 0);
        animation: boot-reveal 0.45s cubic-bezier(0.3, 0.7, 0.2, 1) 0.05s forwards;
      }
      .boot-track {
        position: relative;
        overflow: hidden;
        width: 96px;
        height: 2px;
        border-radius: 1px;
        background: color-mix(in srgb, currentColor 16%, transparent);
        opacity: 0;
        animation: boot-in 0.2s ease 0.4s forwards;
      }
      .boot-track::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 32px;
        border-radius: 1px;
        background: currentColor;
        animation: boot-scan 1.1s cubic-bezier(0.45, 0, 0.55, 1) 0.4s infinite alternate;
      }
      @keyframes boot-reveal {
        to {
          clip-path: inset(0);
        }
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-scan {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(64px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-word,
        .boot-track,
        .boot-track::after {
          animation: none;
        }
        .boot-word {
          clip-path: none;
        }
        .boot-track {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-label="読み込み中">
      <div class="boot-ink">
        <span class="boot-word">fude</span>
        <span class="boot-track"></span>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById("boot");
        // 画面が幕を下ろせずに終わっても（描画の失敗など）、いつまでも隠さない。
        setTimeout(function () {
          boot.remove();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
